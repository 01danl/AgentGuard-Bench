# Optional live-model overlay. The launcher must replace the plugin placeholder
# below with an absolute path; dsh 0.2.1-rc.2 does not stringify a `!!js` plugin-row
# name during profile preflight. Use a fresh DSH_HOME and disposable working directory.
- id: session-title-llm
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_HOME + '/sessions'
    compression: none
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    maxTokens: 1024
    streamIdleTimeoutMs: 15000
- insert:
    - id: agentguard-read-only-validation
      name: __AGENTGUARD_READ_ONLY_PLUGIN__
